# Hot-reload development overlay:
#   docker compose -f compose.yaml -f compose.dev.yaml up      (or ./raadi dev)
# Source is bind-mounted; node_modules and the pnpm store live in named volumes
# (never on the host). Edit code on the host and the services reload.
x-dev: &dev
  image: ${RAADI_IMAGE_PREFIX}/node-dev:${RAADI_VERSION}
  pull_policy: build
  build: !override
    context: .
    dockerfile: deploy/docker/node-dev/Dockerfile
  entrypoint: !reset null
  read_only: false
  # Dev containers run as root to write build output into the bind mount; keep
  # default capabilities so root can read the per-service secret files.
  cap_drop: !reset []
  working_dir: /workspace
  environment:
    NODE_ENV: development
    # Bind mounts from macOS/Windows/Docker Desktop do not always deliver file
    # events into the VM; poll instead.
    CHOKIDAR_USEPOLLING: 'true'
    WATCHPACK_POLLING: 'true'
    TSC_WATCHFILE: DynamicPriorityPolling
    TSC_WATCHDIRECTORY: DynamicPriorityPolling
  volumes: &dev-volumes
    - .:/workspace
    - nm-root:/workspace/node_modules
    - nm-web:/workspace/apps/web/node_modules
    - nm-mobile:/workspace/apps/mobile/node_modules
    - nm-identity-bff:/workspace/services/identity-bff/node_modules
    - nm-listings:/workspace/services/listings/node_modules
    - nm-media:/workspace/services/media/node_modules
    - nm-search:/workspace/services/search/node_modules
    - nm-messaging:/workspace/services/messaging/node_modules
    - nm-notifications:/workspace/services/notifications/node_modules
    - nm-trust:/workspace/services/trust/node_modules
    - nm-payments:/workspace/services/payments/node_modules
    - nm-payments-mock:/workspace/services/payments-mock/node_modules
    - nm-push-mock:/workspace/services/push-mock/node_modules
    - nm-saved:/workspace/services/saved/node_modules
    - nm-audit:/workspace/services/audit/node_modules
    - nm-service-kit:/workspace/packages/service-kit/node_modules
    - nm-ui:/workspace/packages/ui/node_modules
    - nm-api-client:/workspace/packages/api-client/node_modules
    - nm-catalog:/workspace/packages/catalog/node_modules
    - nm-events:/workspace/packages/events/node_modules
    - nm-config:/workspace/packages/config/node_modules
    - nm-e2e:/workspace/tests/e2e/node_modules
    - pnpm-store:/pnpm/store

services:
  # Installs dependencies once into the shared volumes and builds the shared
  # service kit, before the dev servers start.
  dev-deps:
    <<: *dev
    command:
      [
        'sh',
        '-c',
        'pnpm install --frozen-lockfile --prefer-offline && pnpm turbo run build --filter=@raadi/service-kit --filter=@raadi/catalog --filter=@raadi/events',
      ]
    restart: 'no'

  # Rebuilds the shared packages on change, once for every service: each dev
  # server restarts when a package's dist/ changes (node --watch-path).
  dev-packages:
    <<: *dev
    command:
      [
        'pnpm',
        'turbo',
        'run',
        'dev',
        '--filter=@raadi/service-kit',
        '--filter=@raadi/catalog',
        '--filter=@raadi/events',
        '--ui=stream',
      ]
    depends_on:
      dev-deps: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'test -f packages/service-kit/dist/index.js && test -f packages/catalog/dist/index.js && test -f packages/events/dist/index.js',
        ]
      interval: 10s
      start_period: 60s
    deploy:
      resources:
        limits: { memory: 768M }

  identity-bff:
    <<: *dev
    command: ['pnpm', '--filter', 'identity-bff', 'dev']
    depends_on:
      dev-packages: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/readyz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      start_period: 90s
    deploy:
      resources:
        limits: { memory: 640M }

  listings:
