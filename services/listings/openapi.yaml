openapi: 3.1.0
info:
  title: Raadi listings
  version: 1.0.0
  description: |
    Create, edit and read marketplace listings. Reads are public; writes need a
    bearer token (browsers get one from the gateway's token handler). Ownership is
    enforced with OpenFGA and marketplace rules with OPA. Search and browsing are
    served by the search API (`/api/v1/search`).
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: http://raadi.localhost
    description: Local development through the gateway
tags:
  - name: admin
    description: Admin console (console tokens only, ADR-0030)
  - name: listings
  - name: internal
    description: Service-to-service endpoints, not reachable through the gateway
paths:
  /api/v1/listings:
    post:
      tags: [listings]
      operationId: createListing
      summary: Publish a new listing
      security: [{ bearer: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateListing' }
      responses:
        '201':
          description: Created
          headers:
            Location: { schema: { type: string } }
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Listing' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/listings/mine:
    get:
      tags: [listings]
      operationId: myListings
      summary: The caller's own listings (active and sold)
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 20 },
          }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: A page of listings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListingPage' }
        '401': { $ref: '#/components/responses/Problem' }
  /api/v1/listings/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [listings]
      operationId: getListing
      summary: A listing (public; with a token, also the caller's permissions)
      responses:
        '200':
          description: The listing
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Listing' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [listings]
      operationId: updateListing
      summary: Edit a listing or mark it sold (owner or platform admin)
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - name: If-Match
          in: header
          description: ETag from a previous read; the update fails with 412 if the listing changed since.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateListing' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Listing' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [listings]
      operationId: deleteListing
      summary: Remove a listing (owner or moderator)
      security: [{ bearer: [] }, { session: [] }]
      responses:
        '204': { description: Removed }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /internal/v1/listings/{id}/contact:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [internal]
      operationId: listingContact
      summary: Seller to contact about a listing (internal network only; messaging)
      description: Not routed by the gateway. Callers forward the user's bearer token.
      security: [{ bearer: [] }]
      responses:
        '200':
          description: Contact details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListingContact' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /healthz:
    get:
      operationId: liveness
      responses: { '200': { description: Process is alive } }
  /readyz:
    get:
      operationId: readiness
      responses:
        '200': { description: Ready }
        '503': { description: A dependency is unavailable or the service is draining }
  /api/v1/listings/{id}/reports:
    post:
      tags: [listings]
      operationId: reportListing
      summary: Report a listing to the moderators (ADR-0027); reporting again updates the open report
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportInput' }
      responses:
        '202':
          description: Received
          content:
            application/json:
              schema:
                type: object
                required: [received]
                properties: { received: { type: boolean, const: true } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422':
          description: own_listing or too_many_reports
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /admin/v1/listings:
    get:
      tags: [admin]
      operationId: adminSearchListings
      summary: Every listing in any state (moderators, support, platform admins)
      description: Admin console only (console tokens; not routed by the gateway, ADR-0030).
      parameters:
        - {
            name: q,
            in: query,
            schema:
              {
                type: string,
                maxLength: 100,
                description: Title or seller name; an id or its start finds that listing,
              },
          }
        - { name: owner, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [active, sold, deleted] } }
        - { name: category, in: query, schema: { type: string } }
        - { name: reported, in: query, schema: { type: string, enum: ['true', 'false'] } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 25 },
          }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: A page of listings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminListingPage' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /admin/v1/listings/stats:
    get:
      tags: [admin]
      operationId: adminListingStats
      summary: Listing counts, daily new listings and moderation throughput
      responses:
        '200':
          description: Statistics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListingStats' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /admin/v1/listings/workbench:
    get:
      tags: [admin]
      operationId: adminModerationWorkbench
      summary: Reported listings with everything needed to decide, riskiest first
      parameters:
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 50 },
          }
      responses:
        '200':
          description: The queue
          content:
            application/json:
              schema:
                {
                  type: object,
                  additionalProperties: false,
                  required: [items],
                  properties:
                    {
                      items: { type: array, items: { $ref: '#/components/schemas/WorkbenchItem' } },
                    },
                }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /admin/v1/listings/history:
    get:
      tags: [admin]
      operationId: adminModerationHistory
      summary: Recent moderation decisions
      parameters:
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 50 },
          }
        - { name: handledBy, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Decisions
          content:
            application/json:
              schema:
                {
                  type: object,
                  additionalProperties: false,
                  required: [items],
                  properties:
                    {
                      items:
                        { type: array, items: { $ref: '#/components/schemas/ModerationDecision' } },
                    },
                }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /admin/v1/listings/sellers/{id}:
    get:
      tags: [admin]
      operationId: adminSellerSnapshot
      summary: A seller's listing history
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The seller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SellerSnapshot' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /admin/v1/listings/dismiss:
    post:
      tags: [admin]
      operationId: adminDismissReports
      summary: Close the open reports of one or more listings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DismissInput' }
      responses:
        '201':
          description: Closed
          content:
            application/json:
              schema:
                {
                  type: object,
                  additionalProperties: false,
                  required: [closed],
                  properties: { closed: { type: integer } },
                }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /admin/v1/listings/{id}:
    get:
      tags: [admin]
      operationId: adminListing
      summary: One listing with its reports, seller history and other listings
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The listing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminListingDetail' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /admin/v1/listings/{id}/remove:
    post:
      tags: [admin]
      operationId: adminRemoveListing
      summary: Remove the listing with a reason (resolves its reports)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RemoveInput' }
      responses:
        '200':
          description: Removed
          content:
            application/json:
              schema:
                {
                  type: object,
                  additionalProperties: false,
                  required: [removed],
                  properties: { removed: { type: boolean } },
                }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
    session: { type: apiKey, in: cookie, name: raadi_sid }
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    RemovalReason:
      type: string
      enum: [fraud, prohibited, offensive, wrong_category, duplicate, spam, other]
    AdminListing:
      type: object
      additionalProperties: false
      required:
        [
          id,
          title,
          status,
          category,
          subcategory,
          priceNok,
          ownerId,
          sellerName,
          placeId,
          createdAt,
          updatedAt,
          promotedUntil,
          removedBy,
          removalReason,
          openReports,
          image,
        ]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        status: { type: string, enum: [active, sold, deleted] }
        category: { type: string }
        subcategory: { type: string }
        priceNok: { type: [integer, 'null'] }
        ownerId: { type: string, format: uuid }
        sellerName: { type: string }
        placeId: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        promotedUntil: { type: [string, 'null'], format: date-time }
        removedBy: { type: [string, 'null'], enum: [owner, moderation, null] }
        removalReason:
          oneOf:
            - { type: 'null' }
            - { $ref: '#/components/schemas/RemovalReason' }
        openReports: { type: integer }
        image:
          oneOf:
            - { type: 'null' }
            - type: object
              additionalProperties: false
              required: [thumb, card]
              properties: { thumb: { type: string }, card: { type: string } }
    AdminListingPage:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AdminListing' } }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    AdminReport:
      type: object
      additionalProperties: false
      required:
        [id, reason, comment, status, reporterId, createdAt, handledBy, handledAt, handledNote]
      properties:
        id: { type: string, format: uuid }
        reason: { type: string, enum: [fraud, prohibited, offensive, wrong_category, other] }
        comment: { type: string }
        status: { type: string, enum: [open, resolved, dismissed] }
        reporterId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        handledBy: { type: [string, 'null'], format: uuid }
        handledAt: { type: [string, 'null'], format: date-time }
        handledNote: { type: [string, 'null'] }
    SellerSnapshot:
      type: object
      additionalProperties: false
      required: [ownerId, active, sold, deleted, removedByModeration, reports, firstListingAt]
      properties:
        ownerId: { type: string, format: uuid }
        active: { type: integer }
        sold: { type: integer }
        deleted: { type: integer }
        removedByModeration: { type: integer }
        reports: { type: integer, description: "Reports about the seller's listings, ever" }
        firstListingAt: { type: [string, 'null'], format: date-time }
    AdminListingDetail:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - status
        - category
        - subcategory
        - priceNok
        - ownerId
        - sellerName
        - placeId
        - createdAt
        - updatedAt
        - promotedUntil
        - removedBy
        - removalReason
        - openReports
        - image
        - description
        - attributes
        - images
        - version
        - reports
        - seller
        - otherListings
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        status:
          type: string
          enum:
            - active
            - sold
            - deleted
        category:
          type: string
        subcategory:
          type: string
        priceNok:
          type:
            - integer
            - 'null'
        ownerId:
          type: string
          format: uuid
        sellerName:
          type: string
        placeId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        promotedUntil:
          type:
            - string
            - 'null'
          format: date-time
        removedBy:
          type:
            - string
            - 'null'
          enum:
            - owner
            - moderation
            - null
        removalReason:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/RemovalReason'
        openReports:
          type: integer
        image:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required:
                - thumb
                - card
              properties:
                thumb:
                  type: string
                card:
                  type: string
        description:
          type: string
        attributes:
          type: object
          additionalProperties:
            type:
              - string
              - number
              - boolean
        images:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - thumb
              - card
              - large
            properties:
              thumb:
                type: string
              card:
                type: string
              large:
                type: string
        version:
          type: integer
        reports:
          type: array
          items:
            $ref: '#/components/schemas/AdminReport'
        seller:
          $ref: '#/components/schemas/SellerSnapshot'
        otherListings:
          type: array
          items:
            $ref: '#/components/schemas/AdminListing'
    WorkbenchItem:
      type: object
      additionalProperties: false
      required: [listing, count, reasons, firstReportedAt, risk]
      properties:
        listing: { $ref: '#/components/schemas/AdminListingDetail' }
        count: { type: integer }
        reasons: { type: object, additionalProperties: { type: integer } }
        firstReportedAt: { type: string, format: date-time }
        risk:
          {
            type: integer,
            minimum: 0,
            maximum: 100,
            description: 'A rough priority: report volume, fraud reports, seller history, age',
          }
    ModerationDecision:
      type: object
      additionalProperties: false
      required: [listingId, title, outcome, reports, handledBy, handledAt, note, secondsToDecision]
      properties:
        listingId: { type: string, format: uuid }
        title: { type: string }
        outcome: { type: string, enum: [resolved, dismissed] }
        reports: { type: integer }
        handledBy: { type: string, format: uuid }
        handledAt: { type: string, format: date-time }
        note: { type: [string, 'null'] }
        secondsToDecision: { type: integer }
    ListingStats:
      type: object
      additionalProperties: false
      required: [active, sold, removed, created, byCategory, moderation]
      properties:
        active: { type: integer }
        sold: { type: integer }
        removed: { type: integer }
        created:
          {
            type: array,
            items:
              {
                type: object,
                additionalProperties: false,
                required: [day, count],
                properties: { day: { type: string, format: date }, count: { type: integer } },
              },
          }
        byCategory:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [category, count]
            properties: { category: { type: string }, count: { type: integer } }
        moderation:
          type: object
          additionalProperties: false
          required:
            [
              open,
              listings,
              oldestAt,
              handled7d,
              removed7d,
              dismissed7d,
              medianHandleSeconds,
              handled,
            ]
          properties:
            open: { type: integer }
            listings: { type: integer }
            oldestAt: { type: [string, 'null'], format: date-time }
            handled7d: { type: integer }
            removed7d: { type: integer }
            dismissed7d: { type: integer }
            medianHandleSeconds: { type: [integer, 'null'] }
            handled:
              {
                type: array,
                items:
                  {
                    type: object,
                    additionalProperties: false,
                    required: [day, count],
                    properties: { day: { type: string, format: date }, count: { type: integer } },
                  },
              }
    RemoveInput:
      type: object
      additionalProperties: false
      required: [reasonCode]
      properties:
        reasonCode: { $ref: '#/components/schemas/RemovalReason' }
        note: { type: string, maxLength: 500 }
    DismissInput:
      type: object
      additionalProperties: false
      required: [ids]
      properties:
        ids: { type: array, minItems: 1, maxItems: 50, items: { type: string, format: uuid } }
        note: { type: string, maxLength: 500 }
    Category: { type: string, enum: [torget, bil, eiendom, jobb, reise] }
    Attributes:
      type: object
      description: Category-specific attributes (see @raadi/catalog), e.g. {"condition":"good"} for torget.
      additionalProperties: { type: [string, number, boolean] }
    Location:
      type: object
      required: [placeId, name, county, lat, lon]
      properties:
        placeId: { type: string }
        name: { type: string }
        county: { type: string }
        lat: { type: number }
        lon: { type: number }
    ImageUrls:
      type: object
      required: [thumb, card, large]
      properties:
        thumb: { type: string }
        card: { type: string }
        large: { type: string }
    ListingImage:
      type: object
      required: [id, urls]
      properties:
        id: { type: string, format: uuid }
        urls: { $ref: '#/components/schemas/ImageUrls' }
    Listing:
      type: object
      required:
        [
          id,
          version,
          status,
          category,
          subcategory,
          title,
          description,
          priceNok,
          attributes,
          location,
          images,
          seller,
          publishedAt,
          updatedAt,
          promotedUntil,
        ]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        status: { type: string, enum: [active, sold, deleted] }
        category: { $ref: '#/components/schemas/Category' }
        subcategory: { type: string }
        title: { type: string }
        description: { type: string }
        priceNok: { type: [integer, 'null'] }
        attributes: { $ref: '#/components/schemas/Attributes' }
        location: { $ref: '#/components/schemas/Location' }
        images: { type: array, items: { $ref: '#/components/schemas/ListingImage' } }
        seller:
          type: object
          required: [name]
          properties: { name: { type: string } }
        publishedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        promotedUntil:
          type: [string, 'null']
          format: date-time
          description: End of a running paid promotion; null when not promoted (ADR-0020)
        viewer:
          type: object
          required: [isOwner, canEdit, canDelete]
          properties:
            isOwner: { type: boolean }
            canEdit: { type: boolean }
            canDelete: { type: boolean }
      additionalProperties: false
    ListingPage:
      type: object
      required: [total, limit, offset, items]
      properties:
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
        items: { type: array, items: { $ref: '#/components/schemas/Listing' } }
    CreateListing:
      type: object
      required: [category, subcategory, title, description, attributes, placeId]
      additionalProperties: false
      properties:
        category: { $ref: '#/components/schemas/Category' }
        subcategory: { type: string, maxLength: 40 }
        title: { type: string, minLength: 3, maxLength: 120 }
        description: { type: string, minLength: 1, maxLength: 5000 }
        priceNok:
          {
            type: [integer, 'null'],
            minimum: 0,
            description: Required except for jobb (must be null),
          }
        attributes: { $ref: '#/components/schemas/Attributes' }
        placeId: { type: string, description: Place id from the gazetteer (e.g. oslo, bergen) }
        imageIds:
          type: array
          maxItems: 10
          uniqueItems: true
          items: { type: string, format: uuid }
          description: Ids returned by the media API; only your own, scanned images
    UpdateListing:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        category: { $ref: '#/components/schemas/Category' }
        subcategory: { type: string, maxLength: 40 }
        title: { type: string, minLength: 3, maxLength: 120 }
        description: { type: string, minLength: 1, maxLength: 5000 }
        priceNok: { type: [integer, 'null'], minimum: 0 }
        attributes: { $ref: '#/components/schemas/Attributes' }
        placeId: { type: string }
        imageIds:
          type: array
          maxItems: 10
          uniqueItems: true
          items: { type: string, format: uuid }
        status: { type: string, enum: [active, sold] }
    ListingContact:
      type: object
      additionalProperties: false
      required: [listingId, ownerId, sellerName, title, status, imageId]
      properties:
        listingId: { type: string, format: uuid }
        ownerId: { type: string, format: uuid, description: Keycloak subject of the seller }
        sellerName: { type: string }
        title: { type: string }
        status: { type: string, enum: [active, sold] }
        imageId: { type: [string, 'null'], format: uuid }
    ReportReason:
      type: string
      enum: [fraud, prohibited, offensive, wrong_category, other]
    ReportInput:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { $ref: '#/components/schemas/ReportReason' }
        comment: { type: string, maxLength: 500 }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        traceId: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              path: { type: string }
              message: { type: string }
              code: { type: string }
