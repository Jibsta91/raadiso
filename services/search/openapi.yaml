openapi: 3.1.0
info:
  title: Raadi search
  version: 1.0.0
  description: |
    Public, anonymous search over active listings in one country (ADR-0040): full text
    (stemming, typo tolerance), facets generated from the country's taxonomy, price ranges
    in its currency and geo radius. Results are eventually
    consistent with the listings API (typically within a second, via Kafka).
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: http://raadi.localhost
    description: Local development through the gateway
tags:
  - name: admin
    description: Admin console (console tokens only, ADR-0030)
  - name: search
paths:
  /api/v1/search/listings:
    get:
      tags: [search]
      operationId: searchListings
      summary: Search listings
      parameters:
        - name: country
          in: query
          description: The marketplace searched (XS is Somaliland); the service's default when absent (ADR-0040)
          schema: { type: string, enum: [XS, NO] }
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
        - name: understand
          in: query
          description: >-
            false searches the words as typed; otherwise categories, places, prices and "cheap" in the
            query become filters and a sort (ADR-0041), listed in the response's `query.understood`
          schema: { type: string, enum: ['true', 'false'] }
        - { name: category, in: query, description: Comma-separated, schema: { type: string } }
        - { name: subcategory, in: query, description: Comma-separated, schema: { type: string } }
        - {
            name: region,
            in: query,
            description: Comma-separated region ids of the country,
            schema: { type: string },
          }
        - { name: condition, in: query, description: Comma-separated, schema: { type: string } }
        - {
            name: make,
            in: query,
            description: Comma-separated makes (case-insensitive),
            schema: { type: string },
          }
        - { name: fuel, in: query, description: Comma-separated, schema: { type: string } }
        - { name: gearbox, in: query, description: Comma-separated, schema: { type: string } }
        - { name: bodyType, in: query, description: Comma-separated, schema: { type: string } }
        - { name: drivetrain, in: query, description: Comma-separated, schema: { type: string } }
        - { name: propertyType, in: query, description: Comma-separated, schema: { type: string } }
        - { name: ownership, in: query, description: Comma-separated, schema: { type: string } }
        - {
            name: employmentType,
            in: query,
            description: Comma-separated,
            schema: { type: string },
          }
        - { name: usage, in: query, description: Comma-separated, schema: { type: string } }
        - { name: steering, in: query, description: Comma-separated, schema: { type: string } }
        - { name: furnishing, in: query, description: Comma-separated, schema: { type: string } }
        - { name: landUse, in: query, description: Comma-separated, schema: { type: string } }
        - { name: dealType, in: query, description: Comma-separated, schema: { type: string } }
        - { name: brand, in: query, description: Comma-separated, schema: { type: string } }
        - { name: itemType, in: query, description: Comma-separated, schema: { type: string } }
        - { name: sex, in: query, description: Comma-separated, schema: { type: string } }
        - { name: yearMin, in: query, schema: { type: integer, minimum: 0 } }
        - { name: yearMax, in: query, schema: { type: integer, minimum: 0 } }
        - { name: mileageMin, in: query, schema: { type: integer, minimum: 0 } }
        - { name: mileageMax, in: query, schema: { type: integer, minimum: 0 } }
        - { name: areaMin, in: query, schema: { type: integer, minimum: 0 } }
        - { name: areaMax, in: query, schema: { type: integer, minimum: 0 } }
        - { name: bedroomsMin, in: query, schema: { type: integer, minimum: 0 } }
        - { name: bedroomsMax, in: query, schema: { type: integer, minimum: 0 } }
        - { name: guestsMin, in: query, schema: { type: integer, minimum: 0 } }
        - { name: guestsMax, in: query, schema: { type: integer, minimum: 0 } }
        - { name: storageMin, in: query, schema: { type: integer, minimum: 0 } }
        - { name: storageMax, in: query, schema: { type: integer, minimum: 0 } }
        - { name: headMin, in: query, schema: { type: integer, minimum: 0 } }
        - { name: headMax, in: query, schema: { type: integer, minimum: 0 } }
        - {
            name: publishedAfter,
            in: query,
            description: Only listings published after this time (exclusive); saved searches use it,
            schema: { type: string, format: date-time },
          }
        - {
            name: publishedBefore,
            in: query,
            description: Only listings published at or before this time,
            schema: { type: string, format: date-time },
          }
        - {
            name: priceMin,
            in: query,
            description: Major units of the country's currency (12.5 is $12.50),
            schema: { type: number, minimum: 0 },
          }
        - { name: priceMax, in: query, schema: { type: number, minimum: 0 } }
        - name: priceDropped
          in: query
          description: Only listings whose price dropped in the last 30 days (ADR-0044)
          schema: { type: string, enum: ['true'] }
        - {
            name: near,
            in: query,
            description: Place id (centre of a radius search),
            schema: { type: string },
          }
        - { name: lat, in: query, schema: { type: number } }
        - { name: lon, in: query, schema: { type: number } }
        - {
            name: radiusKm,
            in: query,
            schema: { type: number, minimum: 1, maximum: 2000, default: 50 },
          }
        - name: sort
          in: query
          schema:
            {
              type: string,
              enum:
                [
                  relevance,
                  newest,
                  price_asc,
                  price_desc,
                  distance,
                  price_drop,
                  year_desc,
                  mileage_asc,
                  area_desc,
                  storage_desc,
                  head_desc,
                  price_per_area_asc,
                ],
              default: relevance,
            }
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 1 } }
        - {
            name: pageSize,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 48, default: 24 },
          }
      responses:
        '200':
          description: Results with facets
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResult' }
        '400': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/search/autocomplete:
    get:
      tags: [search]
      operationId: autocomplete
      summary: What to offer while someone types (ADR-0041)
      description: >-
        Categories whose words start with the input (with listing counts), title completions and
        places, in one country.
      parameters:
        - {
            name: q,
            in: query,
            required: true,
            schema: { type: string, minLength: 1, maxLength: 60 },
          }
        - { name: country, in: query, schema: { type: string, enum: [XS, NO] } }
      responses:
        '200':
          description: Suggestions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Autocomplete' }
        '400': { $ref: '#/components/responses/Problem' }
  /api/v1/search/listings/{id}/similar:
    get:
      tags: [search]
      operationId: similarListings
      summary: Listings like this one (ADR-0047)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Up to eight similar active listings; empty for an unknown listing
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/SearchHit' } }
        '400': { $ref: '#/components/responses/Problem' }
  /api/v1/search/listings/{id}/price-insight:
    get:
      tags: [search]
      operationId: priceInsight
      summary: A listing's price against comparable listings (ADR-0043)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The insight, or null without enough comparables
          content:
            application/json:
              schema:
                type: object
                required: [insight]
                properties:
                  insight:
                    oneOf:
                      - { $ref: '#/components/schemas/PriceInsight' }
                      - { type: 'null' }
        '400': { $ref: '#/components/responses/Problem' }
  /api/v1/search/price-guide:
    get:
      tags: [search]
      operationId: priceGuide
      summary: What comparable listings cost, for a seller filling in the form (ADR-0043)
      description: >-
        Other query parameters are the draft's details by attribute key (make, model, year, brand, …).
      parameters:
        - { name: country, in: query, required: true, schema: { type: string, enum: [XS, NO] } }
        - { name: category, in: query, required: true, schema: { type: string } }
        - { name: subcategory, in: query, required: true, schema: { type: string } }
        - { name: placeId, in: query, schema: { type: string } }
      responses:
        '200':
          description: The guide, or null without enough comparables
          content:
            application/json:
              schema:
                type: object
                required: [guide]
                properties:
                  guide:
                    oneOf:
                      - { $ref: '#/components/schemas/PriceGuide' }
                      - { type: 'null' }
        '400': { $ref: '#/components/responses/Problem' }
  /api/v1/search/suggest:
    get:
      tags: [search]
      operationId: suggest
      summary: Title suggestions for search-as-you-type
      parameters:
        - {
            name: q,
            in: query,
            required: true,
            schema: { type: string, minLength: 2, maxLength: 60 },
          }
        - { name: country, in: query, schema: { type: string, enum: [XS, NO] } }
      responses:
        '200':
          description: Suggestions
          content:
            application/json:
              schema:
                type: object
                required: [suggestions]
                properties:
                  suggestions: { type: array, items: { type: string } }
        '400': { $ref: '#/components/responses/Problem' }
  /admin/v1/search/ranking:
    get:
      tags: [admin]
      operationId: adminSearchRanking
      summary: The ranking lab - best match with previewed weights, each score taken apart (ADR-0042)
      description: Admin console only (console tokens; not routed by the gateway, ADR-0030). Saves nothing.
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
        - { name: country, in: query, schema: { type: string, enum: [XS, NO] } }
        - { name: category, in: query, schema: { type: string, maxLength: 40 } }
        - { name: quality, in: query, schema: { type: number, minimum: 0, maximum: 3 } }
        - { name: freshness, in: query, schema: { type: number, minimum: 0, maximum: 3 } }
      responses:
        '200':
          description: Ranked listings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RankingLab' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /admin/v1/search/index:
    get:
      tags: [admin]
      operationId: adminSearchIndex
      summary: Size and freshness of the listings index (operators)
      description: Admin console only (console tokens; not routed by the gateway, ADR-0030).
      responses:
        '200':
          description: Index status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IndexStatus' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
components:
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    IndexStatus:
      type: object
      additionalProperties: false
      required: [alias, version, documents, byStatus, sizeBytes, newestUpdateAt]
      properties:
        alias: { type: string }
        version: { type: integer }
        documents: { type: integer }
        byStatus:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [status, count]
            properties: { status: { type: string }, count: { type: integer } }
        sizeBytes: { type: [integer, 'null'] }
        newestUpdateAt: { type: [string, 'null'], format: date-time }
    FacetValue:
      type: object
      required: [value, count]
      properties:
        value: { type: string }
        count: { type: integer }
    SearchHit:
      type: object
      required:
        [
          id,
          title,
          country,
          price,
          category,
          subcategory,
          location,
          imageCount,
          attributes,
          publishedAt,
          promoted,
        ]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        country: { type: string }
        price:
          oneOf:
            - { $ref: '#/components/schemas/Money' }
            - { type: 'null' }
        category: { type: string }
        subcategory: { type: string }
        location:
          type: object
          required: [placeId, name, region, regionName, lat, lon]
          properties:
            placeId: { type: string }
            name: { type: string }
            region: { type: string }
            regionName: { type: string }
            lat: { type: number }
            lon: { type: number }
        distanceKm: { type: number }
        deal:
          type: string
          enum: [great, good]
          description: A good price against comparable listings (ADR-0043)
        priceDrop:
          type: object
          additionalProperties: false
          required: [previous, at]
          description: A price drop in the last 30 days, the price before and when (ADR-0044)
          properties:
            previous: { $ref: '#/components/schemas/Money' }
            at: { type: string, format: date-time }
        image:
          type: object
          required: [thumb, card]
          properties:
            thumb: { type: string }
            card: { type: string }
        imageCount: { type: integer }
        promoted: { type: boolean, description: A paid promotion is running (ADR-0020) }
        attributes:
          type: object
          additionalProperties: { type: [string, number, boolean] }
        publishedAt: { type: string, format: date-time }
    PriceStats:
      type: object
      additionalProperties: false
      required: [comparables, p25, median, p75, unit, basis]
      properties:
        comparables: { type: integer }
        p25: { type: number, description: Minor units per unit }
        median: { type: number }
        p75: { type: number }
        unit: { type: string, enum: [listing, areaM2, head] }
        basis:
          type: object
          additionalProperties: false
          required: [same, near, region, loosened]
          properties:
            same: { type: array, items: { type: string } }
            near: { type: array, items: { type: string } }
            region: { type: boolean }
            loosened: { type: boolean }
    PriceGuide:
      allOf:
        - { $ref: '#/components/schemas/PriceStats' }
        - type: object
          required: [currency]
          properties: { currency: { type: string } }
    PriceInsight:
      type: object
      additionalProperties: false
      required: [listingId, currency, unitPrice, rating, stats]
      properties:
        listingId: { type: string, format: uuid }
        currency: { type: string }
        unitPrice: { type: number, description: The listing's price per unit, in minor units }
        rating: { type: string, enum: [unusually_low, great, good, fair, high] }
        stats: { $ref: '#/components/schemas/PriceStats' }
    Understood:
      type: object
      additionalProperties: false
      required: [kind, words, set]
      description: One part of the query read as a filter or a sort (ADR-0041)
      properties:
        kind: { type: string, enum: [category, attribute, place, region, sort, price] }
        words: { type: string, description: The words of the query, as typed }
        set:
          type: object
          description: The search parameters it set
          additionalProperties: { type: string }
    RankingWeights:
      type: object
      additionalProperties: false
      required: [quality, freshness]
      properties:
        quality: { type: number }
        freshness: { type: number }
    RankingLab:
      type: object
      additionalProperties: false
      required: [weights, defaults, query, total, items]
      properties:
        weights: { $ref: '#/components/schemas/RankingWeights' }
        defaults: { $ref: '#/components/schemas/RankingWeights' }
        query:
          type: object
          required: [text, understood]
          properties:
            text: { type: string }
            understood: { type: array, items: { $ref: '#/components/schemas/Understood' } }
        total: { type: integer }
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              [
                id,
                title,
                category,
                subcategory,
                imageCount,
                publishedAt,
                promoted,
                relevance,
                quality,
                freshness,
                multiplier,
                score,
              ]
            properties:
              id: { type: string, format: uuid }
              title: { type: string }
              category: { type: string }
              subcategory: { type: string }
              imageCount: { type: integer }
              publishedAt: { type: string, format: date-time }
              promoted: { type: boolean }
              relevance:
                { type: number, description: Text relevance and boosts, before multipliers }
              quality: { type: number }
              freshness: { type: number }
              multiplier: { type: number }
              score: { type: number }
    Autocomplete:
      type: object
      additionalProperties: false
      required: [categories, queries, places]
      properties:
        categories:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [category, count]
            properties:
              category: { type: string }
              subcategory: { type: string }
              count: { type: integer }
        queries: { type: array, items: { type: string } }
        places:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [placeId, name]
            properties:
              placeId: { type: string }
              name: { type: string }
    Money:
      type: object
      additionalProperties: false
      required: [amountMinor, currency]
      description: An amount in minor units (cents, øre) of an ISO 4217 currency (ADR-0040)
      properties:
        amountMinor: { type: integer, minimum: 0 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
    SearchResult:
      type: object
      additionalProperties: false
      required:
        [country, currency, total, page, pageSize, items, facets, priceRanges, query, relaxed]
      properties:
        query:
          type: object
          additionalProperties: false
          required: [text, understood]
          description: How the query was read (ADR-0041)
          properties:
            text: { type: string, description: The words searched as text }
            understood: { type: array, items: { $ref: '#/components/schemas/Understood' } }
        relaxed: { type: boolean, description: No listing matched every word; these match some }
        suggestion: { type: string, description: A spelling that would match more ("did you mean") }
        country: { type: string, description: The country searched }
        currency: { type: string, description: Its currency (the price ranges are in it) }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        items: { type: array, items: { $ref: '#/components/schemas/SearchHit' } }
        facets:
          type: object
          description: >-
            Counts per value: always category, subcategory and region, plus the attribute facets of the
            selected category (or of every category of the country when none or several are selected)
          required: [category, subcategory, region]
          properties:
            category: { type: array, items: { $ref: '#/components/schemas/FacetValue' } }
            subcategory: { type: array, items: { $ref: '#/components/schemas/FacetValue' } }
            region: { type: array, items: { $ref: '#/components/schemas/FacetValue' } }
          additionalProperties: { type: array, items: { $ref: '#/components/schemas/FacetValue' } }
        priceRanges:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [key, count]
            properties:
              key: { type: string }
              from: { type: number, description: Major units, inclusive }
              to: { type: number, description: Major units, exclusive }
              count: { type: integer }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        traceId: { type: string }
        errors: { type: array, items: { type: object } }
