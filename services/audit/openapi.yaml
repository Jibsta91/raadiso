openapi: 3.1.0
info:
  title: Raadi audit
  version: 1.0.0
  description: |
    The audit log (ADR-0028): an append-only record of staff actions (moderators, support,
    operators, platform admins), written by every service together with the action itself.
    Platform admins only.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: http://raadi.localhost
    description: Local development through the gateway
tags:
  - name: audit
security: [{ bearer: [] }, { session: [] }]
paths:
  /api/v1/audit/entries:
    get:
      tags: [audit]
      operationId: auditEntries
      summary: Audit entries, newest first, filtered (platform admins)
      parameters:
        - { name: actor, in: query, schema: { type: string, format: uuid } }
        - { name: action, in: query, schema: { type: string, maxLength: 60 } }
        - { name: targetType, in: query, schema: { type: string, maxLength: 30 } }
        - { name: targetId, in: query, schema: { type: string, maxLength: 100 } }
        - {
            name: before,
            in: query,
            description: Only entries older than this (the previous page's last `at`),
            schema: { type: string, format: date-time },
          }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 200, default: 50 },
          }
      responses:
        '200':
          description: A page of entries
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, hasMore]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } }
                  hasMore: { type: boolean }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /healthz:
    get:
      operationId: liveness
      security: []
      responses: { '200': { description: Process is alive } }
  /readyz:
    get:
      operationId: readiness
      security: []
      responses:
        '200': { description: Ready }
        '503': { description: Not ready }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
    session: { type: apiKey, in: cookie, name: raadi_sid }
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    AuditEntry:
      type: object
      additionalProperties: false
      required: [id, actor, action, target, reason, source, at]
      properties:
        id: { type: string, format: uuid }
        actor:
          type: object
          additionalProperties: false
          required: [id, roles]
          properties:
            id: { type: string, format: uuid }
            roles: { type: array, items: { type: string } }
        action: { type: string, description: 'Dotted verb, e.g. listing.remove, payment.refund' }
        target:
          type: object
          additionalProperties: false
          required: [type, id]
          properties:
            type: { type: string }
            id: { type: string }
        reason: { type: [string, 'null'] }
        source: { type: string, description: The service that recorded it (CloudEvents source) }
        at: { type: string, format: date-time }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        traceId: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              path: { type: string }
              message: { type: string }
              code: { type: string }
