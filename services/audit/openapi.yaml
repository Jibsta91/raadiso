openapi: 3.1.0
info:
  title: Raadi audit
  version: 1.0.0
  description: |
    The audit log (ADR-0028): an append-only record of staff actions (moderators, support,
    operators, platform admins), written by every service together with the action itself.
    Platform admins only.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: http://raadi.localhost
    description: Local development through the gateway
tags:
  - name: admin
    description: Admin console (console tokens only, ADR-0030)
  - name: audit
security: [{ bearer: [] }, { session: [] }]
paths:
  /admin/v1/audit/entries:
    get:
      tags: [audit]
      operationId: adminAuditEntries
      summary: Audit entries for the admin console (console tokens only)
      description: |
        Platform admins read everything. Other staff must name a target (`targetId`) or
        themselves (`actor`): the history of one object or their own actions. Not routed by the
        gateway; the console calls it from its server (ADR-0030).
      parameters:
        - { name: actor, in: query, schema: { type: string, format: uuid } }
        - { name: action, in: query, schema: { type: string, maxLength: 60 } }
        - { name: targetType, in: query, schema: { type: string, maxLength: 30 } }
        - { name: targetId, in: query, schema: { type: string, maxLength: 100 } }
        - {
            name: before,
            in: query,
            description: Only entries older than this (the previous page's last `at`),
            schema: { type: string, format: date-time },
          }
        - name: after
          in: query
          description: >-
            The next page: entries after this one, newest first (the previous page's last `id`). Exact
            where `before` is not (entries can share a time).
          schema: { type: string, format: uuid }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 200, default: 50 },
          }
      responses:
        '200':
          description: A page of entries
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, hasMore]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } }
                  hasMore: { type: boolean }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /admin/v1/audit/stats:
    get:
      tags: [audit]
      operationId: adminAuditStats
      summary: Entries per day, top actions and most active staff (platform admins)
      parameters:
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 90, default: 14 } }
      responses:
        '200':
          description: Statistics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditStats' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /healthz:
    get:
      operationId: liveness
      security: []
      responses: { '200': { description: Process is alive } }
  /readyz:
    get:
      operationId: readiness
      security: []
      responses:
        '200': { description: Ready }
        '503': { description: Not ready }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
    session: { type: apiKey, in: cookie, name: raadi_sid }
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    AuditEntry:
      type: object
      additionalProperties: false
      required: [id, actor, action, target, reason, details, source, at]
      properties:
        id: { type: string, format: uuid }
        actor:
          type: object
          additionalProperties: false
          required: [id, roles]
          properties:
            id: { type: string, format: uuid }
            roles: { type: array, items: { type: string } }
        action: { type: string, description: 'Dotted verb, e.g. listing.remove, payment.refund' }
        target:
          type: object
          additionalProperties: false
          required: [type, id]
          properties:
            type: { type: string }
            id: { type: string }
        reason: { type: [string, 'null'] }
        details:
          type: [object, 'null']
          description: What changed, as ids, codes and numbers (never names or free text about people)
          additionalProperties:
            oneOf:
              - { type: string }
              - { type: number }
              - { type: boolean }
              - { type: array, items: { type: string } }
        source: { type: string, description: The service that recorded it (CloudEvents source) }
        at: { type: string, format: date-time }
    AuditStats:
      type: object
      additionalProperties: false
      required: [days, actions, actors, total]
      properties:
        days:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [day, count]
            properties: { day: { type: string, format: date }, count: { type: integer } }
        actions:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [action, count]
            properties: { action: { type: string }, count: { type: integer } }
        actors:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, count]
            properties: { id: { type: string, format: uuid }, count: { type: integer } }
        total: { type: integer }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        traceId: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              path: { type: string }
              message: { type: string }
              code: { type: string }
