openapi: 3.1.0
info:
  title: Raadi trust
  version: 1.0.0
  description: |
    Reviews between buyers and sellers, and identity verification with BankID (ADR-0018).
    A buyer and a seller who both wrote in a conversation about a listing may rate each
    other once the listing is sold, once per direction, for a limited time. Trust profiles
    (name, verification, rating and reviews) are public.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: http://raadi.localhost
    description: Local development through the gateway
tags:
  - name: admin
    description: Admin console (console tokens only, ADR-0030)
  - name: profiles
  - name: reviews
  - name: verification
security: [{ bearer: [] }, { session: [] }]
paths:
  /api/v1/trust/users/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [profiles]
      operationId: trustProfile
      summary: Public trust profile with a page of reviews about the user
      security: []
      parameters:
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 50, default: 20 },
          }
        - {
            name: offset,
            in: query,
            schema: { type: integer, minimum: 0, maximum: 10000, default: 0 },
          }
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/trust/listings/{id}/seller:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [profiles]
      operationId: listingSeller
      summary: Trust summary of a listing's seller (listings do not expose owner ids)
      security: []
      responses:
        '200':
          description: Seller summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrustSummary' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/trust/me:
    get:
      tags: [profiles]
      operationId: myTrust
      summary: The caller's own verification and rating
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrustSummary' }
        '401': { $ref: '#/components/responses/Problem' }
  /api/v1/trust/me/reviews:
    get:
      tags: [reviews]
      operationId: myReviews
      summary: The caller's reviews, received or given (ADR-0055)
      parameters:
        - name: direction
          in: query
          schema: { type: string, enum: [received, given], default: received }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 50, default: 20 },
          }
        - {
            name: offset,
            in: query,
            schema: { type: integer, minimum: 0, maximum: 10000, default: 0 },
          }
      responses:
        '200':
          description: A page of reviews, newest first
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, total, limit, offset]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/MyReview' }
                  total: { type: integer, minimum: 0 }
                  limit: { type: integer }
                  offset: { type: integer }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
  /api/v1/trust/me/pending-reviews:
    get:
      tags: [reviews]
      operationId: pendingReviews
      summary: Finished deals the caller may still review, closest deadline first (ADR-0055)
      description: >-
        The same rules as eligibility: the listing is sold within the review window, the caller and
        the other person both wrote to each other about it, and the caller has not reviewed them for
        it. At most 50.
      responses:
        '200':
          description: Deals waiting for the caller's review
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PendingReview' }
        '401': { $ref: '#/components/responses/Problem' }
  /api/v1/trust/eligibility:
    get:
      tags: [reviews]
      operationId: reviewEligibility
      summary: Whether the caller may review a person about a listing
      parameters:
        - { name: listingId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: subjectId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Decision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Eligibility' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
  /api/v1/trust/reviews:
    post:
      tags: [reviews]
      operationId: createReview
      summary: Review the other party of a sold listing
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewInput' }
      responses:
        '201':
          description: Published
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /api/v1/trust/reviews/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [reviews]
      operationId: removeReview
      summary: Withdraw your own review, or remove any review (moderators)
      description: The review stays recorded, so the same deal cannot be reviewed again.
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/trust/verification/start:
    get:
      tags: [verification]
      operationId: startVerification
      summary: Browser navigation that starts BankID verification
      description: |
        Redirects to BankID, or to login first when signed out. BankID returns to
        /api/v1/trust/verification/callback, which redirects to `returnTo` with
        `verification=ok|cancelled|taken|expired|failed` appended.
      security: []
      parameters:
        - { name: returnTo, in: query, schema: { type: string, description: Same-site path } }
        - { name: locale, in: query, schema: { type: string, enum: [nb, en, so] } }
      responses:
        '302': { description: Redirect to BankID or to login }
  /api/v1/trust/verification/callback:
    get:
      tags: [verification]
      operationId: verificationCallback
      summary: BankID redirect target (not called by clients)
      security: []
      responses:
        '302': { description: Redirect to the return path with the outcome }
  /api/v1/trust/verification:
    delete:
      tags: [verification]
      operationId: removeVerification
      summary: Remove the caller's verification
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /healthz:
    get:
      operationId: liveness
      security: []
      responses: { '200': { description: Process is alive } }
  /readyz:
    get:
      operationId: readiness
      security: []
      responses:
        '200': { description: Ready }
        '503': { description: Not ready }
  /admin/v1/trust/reviews:
    get:
      tags: [admin]
      operationId: adminSearchReviews
      summary: Reviews, including removed ones
      description: Admin console only (console tokens; not routed by the gateway, ADR-0030).
      parameters:
        - { name: user, in: query, schema: { type: string, format: uuid } }
        - { name: as, in: query, schema: { type: string, enum: [about, by] } }
        - { name: rating, in: query, schema: { type: integer, minimum: 1, maximum: 5 } }
        - { name: removed, in: query, schema: { type: string, enum: ['true', 'false'] } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 25 },
          }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: A page of reviews
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminReviewPage' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /admin/v1/trust/users/{id}:
    get:
      tags: [admin]
      operationId: adminUserTrust
      summary: A user's rating, verification and review history
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Trust
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserTrust' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /admin/v1/trust/reviews/{id}/remove:
    post:
      tags: [admin]
      operationId: adminRemoveReview
      summary: Remove a review with a reason (moderators, platform admins)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RemoveReviewInput' }
      responses:
        '204': { description: Removed }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
    session: { type: apiKey, in: cookie, name: raadi_sid }
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    AdminReview:
      type: object
      additionalProperties: false
      required:
        [
          id,
          listingId,
          listingTitle,
          reviewerId,
          reviewerName,
          subjectId,
          subjectRole,
          rating,
          comment,
          createdAt,
          removedAt,
          removedBy,
        ]
      properties:
        id: { type: string, format: uuid }
        listingId: { type: string, format: uuid }
        listingTitle: { type: string }
        reviewerId: { type: string, format: uuid }
        reviewerName: { type: string }
        subjectId: { type: string, format: uuid }
        subjectRole: { type: string, enum: [buyer, seller] }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string }
        createdAt: { type: string, format: date-time }
        removedAt: { type: [string, 'null'], format: date-time }
        removedBy: { type: [string, 'null'], enum: [author, moderator, null] }
    AdminReviewPage:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AdminReview' } }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    UserTrust:
      type: object
      additionalProperties: false
      required: [userId, name, verifiedAt, rating, given, removed]
      properties:
        userId: { type: string, format: uuid }
        name: { type: [string, 'null'] }
        verifiedAt: { type: [string, 'null'], format: date-time }
        rating:
          type: object
          additionalProperties: false
          required: [average, count]
          properties: { average: { type: [number, 'null'] }, count: { type: integer } }
        given: { type: integer }
        removed:
          { type: integer, description: Reviews by or about the user that moderators removed }
    RemoveReviewInput:
      type: object
      additionalProperties: false
      required: [reasonCode]
      properties:
        reasonCode: { type: string, enum: [abusive, personal_data, not_genuine, off_topic, other] }
        note: { type: string, maxLength: 500 }
    Role:
      type: string
      enum: [buyer, seller]
    Verification:
      type: [object, 'null']
      additionalProperties: false
      required: [method, verifiedAt]
      properties:
        method: { type: string, enum: [bankid] }
        verifiedAt: { type: string, format: date-time }
    RatingSummary:
      type: object
      additionalProperties: false
      required: [average, count, distribution]
      properties:
        average:
          type: [number, 'null']
          minimum: 1
          maximum: 5
          description: Mean rating with one decimal; null without reviews
        count: { type: integer, minimum: 0 }
        distribution:
          type: array
          minItems: 5
          maxItems: 5
          items: { type: integer, minimum: 0 }
          description: Number of 1- to 5-star ratings (index 0 = one star)
    TrustSummary:
      type: object
      additionalProperties: false
      required: [userId, name, verification, rating]
      properties:
        userId: { type: string, format: uuid }
        name: { type: string, description: Public display name ("Kari N.") }
        verification: { $ref: '#/components/schemas/Verification' }
        rating: { $ref: '#/components/schemas/RatingSummary' }
    MyReview:
      type: object
      additionalProperties: false
      required: [id, rating, comment, listing, other, createdAt]
      description: >-
        A review from the caller's side of the deal: other is the person reviewed (given) or the
        reviewer (received)
      properties:
        id: { type: string, format: uuid }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, maxLength: 1000 }
        listing: { $ref: '#/components/schemas/DealListing' }
        other: { $ref: '#/components/schemas/DealParty' }
        createdAt: { type: string, format: date-time }
    PendingReview:
      type: object
      additionalProperties: false
      required: [listing, other, soldAt, deadline]
      properties:
        listing: { $ref: '#/components/schemas/DealListing' }
        other: { $ref: '#/components/schemas/DealParty' }
        soldAt: { type: string, format: date-time }
        deadline:
          type: string
          format: date-time
          description: The end of the review window
    DealListing:
      type: object
      additionalProperties: false
      required: [id, title]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
    DealParty:
      type: object
      additionalProperties: false
      required: [id, name, role]
      properties:
        id: { type: string, format: uuid }
        name:
          type: [string, 'null']
          description: Display name, when trust knows it
        role:
          $ref: '#/components/schemas/Role'
          description: What this person was in the deal
    Review:
      type: object
      additionalProperties: false
      required: [id, rating, comment, subjectRole, listing, reviewer, createdAt]
      properties:
        id: { type: string, format: uuid }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, maxLength: 1000 }
        subjectRole:
          $ref: '#/components/schemas/Role'
          description: What the reviewed person was in the deal
        listing:
          type: object
          additionalProperties: false
          required: [id, title]
          properties:
            id: { type: string, format: uuid }
            title: { type: string }
        reviewer:
          type: object
          additionalProperties: false
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        createdAt: { type: string, format: date-time }
    ReviewPage:
      type: object
      additionalProperties: false
      required: [total, limit, offset, items]
      properties:
        total: { type: integer, minimum: 0 }
        limit: { type: integer }
        offset: { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/Review' }
    Profile:
      type: object
      additionalProperties: false
      required: [userId, name, verification, rating, reviews]
      properties:
        userId: { type: string, format: uuid }
        name: { type: string }
        verification: { $ref: '#/components/schemas/Verification' }
        rating: { $ref: '#/components/schemas/RatingSummary' }
        reviews: { $ref: '#/components/schemas/ReviewPage' }
    ReviewInput:
      type: object
      additionalProperties: false
      required: [listingId, subjectId, rating]
      properties:
        listingId: { type: string, format: uuid }
        subjectId: { type: string, format: uuid, description: The other party of the deal }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, maxLength: 1000, default: '' }
    Eligibility:
      oneOf:
        - type: object
          additionalProperties: false
          required: [canReview, subjectRole, deadline]
          properties:
            canReview: { const: true }
            subjectRole: { $ref: '#/components/schemas/Role' }
            deadline: { type: string, format: date-time }
        - type: object
          additionalProperties: false
          required: [canReview, reason]
          properties:
            canReview: { const: false }
            reason:
              type: string
              enum:
                [
                  self,
                  unknown_listing,
                  not_party,
                  no_conversation,
                  not_sold,
                  window_closed,
                  already_reviewed,
                ]
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        traceId: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              path: { type: string }
              message: { type: string }
              code: { type: string }
