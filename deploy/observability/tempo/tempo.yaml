# Tempo monolithic mode with local storage. The metrics generator derives RED
# metrics and the service graph from spans and remote-writes them to Prometheus.
stream_over_http_enabled: true
server:
  http_listen_port: 3200
  log_format: json
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
# Cut traces into blocks sooner, so fewer stay in memory: Tempo crept up to its 512M limit after a day of
# test traffic, and the status page went red until a restart.
ingester:
  trace_idle_period: 5s
  max_block_duration: 5m
  max_block_bytes: 52428800
compactor:
  compaction:
    block_retention: 168h
metrics_generator:
  registry:
    external_labels:
      source: tempo
  processor:
    span_metrics:
      # Only spans the dashboards use: requests a service serves (SERVER) and events it handles (CONSUMER).
      # Client and internal spans (database calls, HTTP calls out) made 85% of the 6k-series histogram.
      filter_policies:
        - include:
            match_type: regex
            attributes:
              - key: kind
                value: SPAN_KIND_(SERVER|CONSUMER)
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
# Only the processors Grafana uses (service map, RED metrics). "local-blocks"
# (TraceQL metrics) keeps recent traces in memory and does not fit the budget.
overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
usage_report:
  reporting_enabled: false
