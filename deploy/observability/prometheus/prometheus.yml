global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: raadi

otlp:
  promote_resource_attributes:
    - service.name
    - service.namespace
    - service.instance.id
    - deployment.environment.name
  keep_identifying_resource_attributes: true

storage:
  tsdb:
    out_of_order_time_window: 30m

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # Synthetic journeys (ADR-0031): Prometheus asks the blackbox exporter to probe each target.
  - job_name: journeys
    scrape_interval: 30s
    metrics_path: /probe
    file_sd_configs: [{ files: [/prometheus/journeys.yml] }]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
  - job_name: blackbox
    static_configs: [{ targets: ['blackbox:9115'] }]
  - job_name: prometheus
    static_configs: [{ targets: ['localhost:9090'] }]
  - job_name: alertmanager
    static_configs: [{ targets: ['alertmanager:9093'] }]
  - job_name: traefik
    static_configs: [{ targets: ['traefik:8082'] }]
  - job_name: otel-collector
    static_configs: [{ targets: ['otel-collector:8888'] }]
  - job_name: keycloak
    static_configs: [{ targets: ['keycloak:9000'] }]
  - job_name: openbao
    metrics_path: /v1/sys/metrics
    params: { format: [prometheus] }
    static_configs: [{ targets: ['openbao:8200'] }]
  - job_name: grafana
    static_configs: [{ targets: ['grafana:3000'] }]
  - job_name: loki
    static_configs: [{ targets: ['loki:3100'] }]
  - job_name: tempo
    static_configs: [{ targets: ['tempo:3200'] }]
  - job_name: imgproxy
    static_configs: [{ targets: ['imgproxy:8081'] }]
  - job_name: openfga
    static_configs: [{ targets: ['openfga:2112'] }]
  - job_name: opa
    static_configs: [{ targets: ['opa:8181'] }]
  - job_name: seaweedfs
    static_configs: [{ targets: ['seaweedfs:9327'] }]
  - job_name: apicurio
    static_configs: [{ targets: ['apicurio:9000'] }]
