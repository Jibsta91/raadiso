groups:
  - name: event-pipeline
    rules:
      - record: raadi:dlq_messages
        expr: |
          sum(kafka_partition_current_offset_ratio{topic="raadi.dlq"})
            - sum(kafka_partition_oldest_offset_ratio{topic="raadi.dlq"})
      - alert: DeadLettersGrowing
        expr: raadi:dlq_messages - (raadi:dlq_messages offset 15m) > 0
        labels: { severity: warning }
        annotations:
          summary: '{{ $value }} new events went to raadi.dlq in the last 15 minutes'
          description: A consumer gave up on events it can never process (contract violation or bad reference).
          runbook_url: docs/runbooks/event-pipeline.md
      - alert: ConsumerLagHigh
        expr: max by (group, topic) (kafka_consumer_group_lag_sum_ratio) > 500
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: '{{ $labels.group }} is {{ $value }} events behind on {{ $labels.topic }}'
          runbook_url: docs/runbooks/event-pipeline.md
      - alert: ConsumerGroupEmpty
        expr: max by (group) (kafka_consumer_group_members) == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: 'No consumer is running in group {{ $labels.group }}'
          runbook_url: docs/runbooks/event-pipeline.md
      - alert: SearchIndexLagHigh
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(raadi_search_index_lag_seconds_bucket[5m]))) > 60
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: Listing changes take more than a minute to become searchable (p95)
          runbook_url: docs/runbooks/event-pipeline.md

  - name: notifications
    rules:
      - alert: EmailQueueBacklog
        expr: max(raadi_notifications_email_queue) > 50
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: '{{ $value }} e-mails are waiting to be sent'
          description: The mail server or Keycloak (address lookup) is failing; e-mails are retried with backoff.
          runbook_url: docs/runbooks/event-pipeline.md
      - alert: EmailsGivenUp
        expr: sum(increase(raadi_notifications_emails_total{outcome="failed"}[1h])) > 0
        labels: { severity: warning }
        annotations:
          summary: E-mails failed after every retry in the last hour
          runbook_url: docs/runbooks/event-pipeline.md

      - alert: PushQueueBacklog
        expr: max(raadi_notifications_push_queue) > 100
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: '{{ $value }} pushes are waiting to be sent'
          description: Expo's push service (push-mock in development) is slow, failing or refusing the access token.
          runbook_url: docs/runbooks/notifications.md
      - alert: PushesGivenUp
        expr: sum(increase(raadi_notifications_pushes_total{outcome="failed"}[1h])) > 0
        labels: { severity: warning }
        annotations:
          summary: Pushes failed after every retry in the last hour
          runbook_url: docs/runbooks/notifications.md

  - name: saved
    rules:
      - alert: SavedSearchChecksFailing
        expr: sum(increase(raadi_saved_search_checks_total{outcome="failed"}[30m])) > 5
        labels: { severity: warning }
        annotations:
          summary: Saved-search checks fail, so nobody hears about new matches
          description: The saved service cannot query search (search down, OpenSearch unhealthy or a circuit breaker open).
          runbook_url: docs/runbooks/saved.md

  - name: moderation
    rules:
      - alert: ModerationQueueStale
        expr: max(raadi_listings_reports_oldest_age_seconds) > 86400
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: A reported listing has waited more than a day for a moderator
          description: '{{ with query "max(raadi_listings_reports_open)" }}{{ . | first | value }}{{ end }} listings have open reports.'
          runbook_url: docs/runbooks/moderation.md
      - alert: ReportsSpike
        expr: sum(increase(raadi_listings_reports_total{reason!=""}[1h])) > 30
        labels: { severity: info }
        annotations:
          summary: More than 30 listing reports in the last hour
          description: A scam wave, a run of bad listings, or someone flooding the queue (each person may hold 20 open reports).
          runbook_url: docs/runbooks/moderation.md

  - name: payments
    rules:
      - alert: PaymentsStuckOpen
        expr: max(raadi_payments_stuck_orders) > 0
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: '{{ $value }} payment orders have been open for more than 10 minutes'
          description: Reconciliation cannot settle them; the provider is unreachable or refuses Raadi's credentials.
          runbook_url: docs/runbooks/payments.md
      - alert: PaymentWebhooksRejected
        expr: sum(increase(raadi_payments_webhooks_total{outcome="rejected"}[15m])) > 3
        labels: { severity: warning }
        annotations:
          summary: Provider webhooks fail signature checks
          description: Wrong webhook secret, clock skew, a proxy rewriting requests, or forged requests.
          runbook_url: docs/runbooks/payments.md

  - name: marketplace-security
    rules:
      - alert: MalwareUploadsSpike
        expr: sum(increase(raadi_media_uploads_total{outcome="malware"}[1h])) > 5
        labels: { severity: warning }
        annotations:
          summary: More than 5 uploads were rejected as malware in the last hour
          description: Look up the uploaders in the media database (rejected rows keep the user id and signature).
          runbook_url: docs/runbooks/auth-anomalies.md
      - alert: WebSocketOriginRejected
        expr: sum(increase(raadi_messaging_ws_rejected_total{reason="origin"}[15m])) > 10
        labels: { severity: warning }
        annotations:
          summary: WebSocket handshakes from foreign origins are being refused
          description: Cross-site WebSocket hijacking attempts, or the PUBLIC_BASE_URL given to messaging does not match the origin users browse.
          runbook_url: docs/runbooks/messaging.md
