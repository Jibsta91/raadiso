# The image cache (ADR-0059): nginx (BSD-2-Clause) between the gateway's /img/ route and imgproxy.
# A signed image URL never changes what it shows (the source id and the preset are in the signed
# path), so each variant is rendered once and then served from disk.
#
# - Only signed paths are proxied; anything else is a 404 here, never cached.
# - Successful answers are cached for 30 days of disuse (bounded at 2 GB), fresh for an hour, then
#   revalidated in the background with imgproxy's ETag: a cheap 304 that renders nothing but notices
#   a deleted source (a removed listing's photos), so a takedown reaches the cache within the hour.
# - Browsers get `public, max-age=31536000, immutable` on successful answers only; errors `no-store`.
# - X-Cache-Status (HIT, MISS, EXPIRED, STALE, UPDATING, REVALIDATED) shows what happened.
worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  # The root filesystem is read-only: temporary files go to the tmpfs.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  client_max_body_size 0;

  # JSON access log without client addresses (personal data, and always the gateway's here).
  log_format json escape=json '{"time":"$time_iso8601","service":"img-cache","method":"$request_method",'
    '"path":"$uri","status":$status,"cache":"$upstream_cache_status","bytes":$body_bytes_sent,'
    '"request_time":$request_time,"upstream_time":"$upstream_response_time",'
    '"request_id":"$http_x_request_id"}';
  access_log /dev/stdout json;

  # Docker's DNS: imgproxy's address is looked up again when it changes (a recreated container).
  resolver 127.0.0.11 valid=10s ipv6=off;

  upstream imgproxy {
    zone imgproxy 64k;
    server imgproxy:8080 resolve;
    keepalive 16;
  }

  # About 8,000 keys per MB of zone: 16 MB indexes far more than 2 GB of images.
  proxy_cache_path /var/cache/nginx/img levels=1:2 keys_zone=img:16m max_size=2g min_free=1g
    inactive=30d use_temp_path=off;

  map $status $img_cache_control {
    200 'public, max-age=31536000, immutable';
    304 'public, max-age=31536000, immutable';
    default 'no-store';
  }

  server {
    listen 8080;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # /<signature>/<processing>/<source>.<ext>: the gateway strips the /img prefix.
    location ~ "^/[A-Za-z0-9_-]{16,}/[^/]" {
      limit_except GET {
        deny all;
      }
      # The query string is dropped: it is not part of a signed URL and must not split the cache.
      proxy_pass http://imgproxy$uri;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_set_header X-Request-Id $http_x_request_id;
      proxy_connect_timeout 2s;
      proxy_read_timeout 70s;

      proxy_cache img;
      proxy_cache_key $uri;
      proxy_cache_valid 200 1h;
      proxy_cache_valid 404 1m;
      proxy_cache_revalidate on;
      proxy_cache_background_update on;
      proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
      # One render per variant, however many visitors ask for it at once.
      proxy_cache_lock on;
      proxy_cache_lock_timeout 10s;
      proxy_cache_lock_age 10s;
      # imgproxy's 30-day Cache-Control would override the freshness above; browsers get ours.
      proxy_ignore_headers Cache-Control Expires Set-Cookie;
      proxy_hide_header Cache-Control;
      proxy_hide_header Expires;
      add_header Cache-Control $img_cache_control always;
      add_header X-Cache-Status $upstream_cache_status always;
    }

    location / {
      return 404;
    }
  }
}
