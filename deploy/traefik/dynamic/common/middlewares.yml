# Shared middlewares. Templated by Traefik (Go templates + Sprig).
http:
  middlewares:
    security-headers:
      headers:
        frameDeny: true
        contentTypeNosniff: true
        browserXssFilter: false
        referrerPolicy: strict-origin-when-cross-origin
        permissionsPolicy: 'camera=(), microphone=(), geolocation=(self), payment=()'
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        customResponseHeaders:
          Server: ''
          X-Powered-By: ''
          Cross-Origin-Opener-Policy: same-origin

    # Keycloak frames its own pages: the admin console and keycloak-js load
    # /realms/.../3p-cookies/step1.html and the login status iframe from the same
    # origin. DENY broke them (blank admin console), so framing is SAMEORIGIN here,
    # as Keycloak itself sends; other sites still cannot frame the login pages.
    keycloak-headers:
      headers:
        customFrameOptionsValue: SAMEORIGIN
        contentTypeNosniff: true
        browserXssFilter: false
        referrerPolicy: strict-origin-when-cross-origin
        permissionsPolicy: 'camera=(), microphone=(), geolocation=(self), payment=()'
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        customResponseHeaders:
          Server: ''
          X-Powered-By: ''
          Cross-Origin-Opener-Policy: same-origin

    # The Expo app's web export (/m) has no inline scripts; react-native-web injects <style> elements.
    mobile-csp:
      headers:
        contentSecurityPolicy: >-
          default-src 'self';
          script-src 'self';
          style-src 'self' 'unsafe-inline';
          img-src 'self' data: blob:;
          connect-src 'self';
          font-src 'self';
          frame-ancestors 'none';
          form-action 'self' {{ env "AUTH_BASE_URL" }};
          base-uri 'self';
          object-src 'none'

    # Per-client-IP rate limits (token bucket).
    ratelimit-default:
      rateLimit:
        average: 50
        burst: 100
        period: 1s
    ratelimit-auth:
      rateLimit:
        average: 10
        burst: 20
        period: 1s

    # JSON APIs: refuse oversized bodies at the edge (uploads use media-body-limit).
    api-body-limit:
      buffering:
        maxRequestBodyBytes: 1048576

    # Image uploads: one file of at most 10 MB plus the multipart envelope.
    media-body-limit:
      buffering:
        maxRequestBodyBytes: 11534336

    # Static assets: a results page loads many thumbnails at once, and every
    # page view loads about twenty hashed Next.js chunks.
    ratelimit-assets:
      rateLimit:
        average: 200
        burst: 400
        period: 1s

    strip-errors:
      stripPrefix:
        prefixes: ['/errors']
    strip-img:
      stripPrefix:
        prefixes: ['/img']

    compress:
      compress:
        excludedContentTypes: ['text/event-stream']

    # Token-handler: identity-bff turns the session cookie into a short-lived
    # access token (or passes through a mobile bearer token). Every service still
    # validates the JWT itself (zero trust).
    forward-auth:
      forwardAuth:
        address: http://identity-bff:4000/auth/forward
        trustForwardHeader: false
        maxResponseBodySize: 4096
        authResponseHeaders:
          - Authorization
        authRequestHeaders:
          - Cookie
          - Authorization
          - Origin
          - Sec-Fetch-Site
          - X-Forwarded-Method
          - X-Forwarded-Uri
          - X-Forwarded-Host
          - X-Forwarded-Proto

    https-redirect:
      redirectScheme:
        scheme: https
        permanent: true
