# Public routes. Hostnames derive from RAADI_DOMAIN so the same file serves
# raadi.localhost in development and the real domain in production.
{{ $d := env "RAADI_DOMAIN" }}
http:
  routers:
    web:
      rule: Host(`{{ $d }}`)
      entryPoints: [web, websecure]
      service: web
      middlewares: [security-headers, web-csp, ratelimit-default, compress]
      priority: 1

    # Next.js build output: content-hashed, immutable chunks (about 20 per page
    # view). They get the asset limit so they don't use up the budget of the
    # rendered pages and RSC requests; a page that loses a chunk never hydrates.
    web-static:
      rule: Host(`{{ $d }}`) && PathPrefix(`/_next/static/`)
      entryPoints: [web, websecure]
      service: web
      middlewares: [security-headers, ratelimit-assets, compress]
      priority: 100

    # The Expo app's web export. Not PathPrefix(`/m`): that would also match the website's /messages.
    mobile-web:
      rule: Host(`{{ $d }}`) && (Path(`/m`) || PathPrefix(`/m/`))
      entryPoints: [web, websecure]
      service: mobile-web
      middlewares: [security-headers, mobile-csp, ratelimit-default, compress]
      priority: 100

    # Content-hashed bundles and assets of the Expo web export.
    mobile-web-static:
      rule: Host(`{{ $d }}`) && (PathPrefix(`/m/_expo/`) || PathPrefix(`/m/assets/`))
      entryPoints: [web, websecure]
      service: mobile-web
      middlewares: [security-headers, ratelimit-assets, compress]
      priority: 110

    auth-flows:
      rule: Host(`{{ $d }}`) && PathPrefix(`/auth/`) && !Path(`/auth/forward`)
      entryPoints: [web, websecure]
      service: identity-bff
      middlewares: [security-headers, ratelimit-auth]
      priority: 100

    api-identity:
      rule: Host(`{{ $d }}`) && PathPrefix(`/api/v1/identity/`)
      entryPoints: [web, websecure]
      service: identity-bff
      middlewares: [security-headers, ratelimit-default, forward-auth]
      priority: 100

    api-listings:
      rule: Host(`{{ $d }}`) && PathPrefix(`/api/v1/listings`)
      entryPoints: [web, websecure]
      service: listings
      middlewares: [security-headers, ratelimit-default, api-body-limit, forward-auth]
      priority: 100

    api-search:
      rule: Host(`{{ $d }}`) && PathPrefix(`/api/v1/search`)
      entryPoints: [web, websecure]
      service: search
      middlewares: [security-headers, ratelimit-default, compress]
      priority: 100

    api-media:
      rule: Host(`{{ $d }}`) && PathPrefix(`/api/v1/media`)
      entryPoints: [web, websecure]
      service: media
      middlewares: [security-headers, ratelimit-default, media-body-limit, forward-auth]
      priority: 100

    api-messaging:
      rule: Host(`{{ $d }}`) && PathPrefix(`/api/v1/messaging/`)
      entryPoints: [web, websecure]
      service: messaging
      middlewares: [security-headers, ratelimit-default, api-body-limit, forward-auth]
      priority: 100

    api-notifications:
      rule: Host(`{{ $d }}`) && PathPrefix(`/api/v1/notifications`)
      entryPoints: [web, websecure]
      service: notifications
      middlewares: [security-headers, ratelimit-default, api-body-limit, forward-auth]
      priority: 100

    # Reviews and BankID verification. The verification start/callback are
    # top-level browser navigations; forward-auth turns the session cookie
    # into the bearer token that binds the flow to the signed-in user.
    api-trust:
      rule: Host(`{{ $d }}`) && PathPrefix(`/api/v1/trust/`)
      entryPoints: [web, websecure]
      service: trust
      middlewares: [security-headers, ratelimit-default, api-body-limit, forward-auth]
      priority: 100

    api-audit:
      rule: Host(`{{ $d }}`) && PathPrefix(`/api/v1/audit/`)
      entryPoints: [web, websecure]
      service: audit
      middlewares: [security-headers, ratelimit-default, api-body-limit, forward-auth]
      priority: 100

    api-saved:
      rule: Host(`{{ $d }}`) && PathPrefix(`/api/v1/saved/`)
      entryPoints: [web, websecure]
      service: saved
      middlewares: [security-headers, ratelimit-default, api-body-limit, forward-auth]
      priority: 100

    # Payments: orders need a signed-in user (forward-auth); provider webhooks
    # carry no user token and are authenticated by their HMAC signature instead.
    api-payments:
      rule: Host(`{{ $d }}`) && PathPrefix(`/api/v1/payments/`)
      entryPoints: [web, websecure]
      service: payments
      middlewares: [security-headers, ratelimit-default, api-body-limit, forward-auth]
      priority: 100
    api-payments-webhooks:
      rule: Host(`{{ $d }}`) && PathPrefix(`/api/v1/payments/webhooks/`)
      entryPoints: [web, websecure]
      service: payments
      middlewares: [security-headers, ratelimit-default, api-body-limit]
      priority: 110

    # Live delivery (WebSocket, push only). No body buffering or compression on
    # an upgrade; forward-auth turns the session cookie into a bearer token and
    # messaging checks the Origin itself.
    messaging-ws:
      rule: Host(`{{ $d }}`) && Path(`/api/v1/messaging/ws`)
      entryPoints: [web, websecure]
      # Its own service so long-lived sockets do not skew the API's latency metrics.
      service: messaging-ws
      middlewares: [security-headers, ratelimit-auth, forward-auth]
      priority: 110

    # Listing images: signed imgproxy URLs only (anything else is refused upstream).
    images:
      rule: Host(`{{ $d }}`) && PathPrefix(`/img/`)
      entryPoints: [web, websecure]
      service: imgproxy
      middlewares: [security-headers, ratelimit-assets, strip-img]
      priority: 100

    keycloak:
      rule: >-
        Host(`auth.{{ $d }}`) && (PathPrefix(`/realms/`)
        {{- if ne (env "KEYCLOAK_ADMIN_PUBLIC") "false" }} || PathPrefix(`/admin/`){{ end }})
      entryPoints: [web, websecure]
      service: keycloak
      middlewares: [security-headers, ratelimit-auth]

    # Keycloak's static theme assets (about ten per login page) get the normal
    # limit; the strict one is for the endpoints that handle credentials.
    keycloak-static:
      rule: Host(`auth.{{ $d }}`) && (PathPrefix(`/resources/`) || PathPrefix(`/js/`))
      entryPoints: [web, websecure]
      service: keycloak
      middlewares: [security-headers, ratelimit-default]

    grafana:
      rule: Host(`grafana.{{ $d }}`)
      entryPoints: [web, websecure]
      service: grafana
      middlewares: [security-headers, ratelimit-default]

  services:
    web:
      loadBalancer:
        servers: [{ url: "http://web:3000" }]
        healthCheck: { path: /api/health, interval: 10s, timeout: 3s }
    mobile-web:
      loadBalancer:
        servers: [{ url: "http://mobile-web:8080" }]
        healthCheck: { path: /healthz, interval: 10s, timeout: 3s }
    identity-bff:
      loadBalancer:
        servers: [{ url: "http://identity-bff:4000" }]
        healthCheck: { path: /healthz, interval: 10s, timeout: 3s }
    listings:
      loadBalancer:
        servers: [{ url: "http://listings:4000" }]
        healthCheck: { path: /healthz, interval: 10s, timeout: 3s }
    search:
      loadBalancer:
        servers: [{ url: "http://search:4000" }]
        healthCheck: { path: /healthz, interval: 10s, timeout: 3s }
    media:
      loadBalancer:
        servers: [{ url: "http://media:4000" }]
        healthCheck: { path: /healthz, interval: 10s, timeout: 3s }
    messaging:
      loadBalancer:
        servers: [{ url: "http://messaging:4000" }]
        healthCheck: { path: /healthz, interval: 10s, timeout: 3s }
    messaging-ws:
      loadBalancer:
        servers: [{ url: "http://messaging:4000" }]
        healthCheck: { path: /healthz, interval: 10s, timeout: 3s }
    notifications:
      loadBalancer:
        servers: [{ url: "http://notifications:4000" }]
        healthCheck: { path: /healthz, interval: 10s, timeout: 3s }
    trust:
      loadBalancer:
        servers: [{ url: "http://trust:4000" }]
        healthCheck: { path: /healthz, interval: 10s, timeout: 3s }
    audit:
      loadBalancer:
        servers: [{ url: "http://audit:4000" }]
        healthCheck: { path: /healthz, interval: 10s, timeout: 3s }
    saved:
      loadBalancer:
        servers: [{ url: "http://saved:4000" }]
        healthCheck: { path: /healthz, interval: 10s, timeout: 3s }
    payments:
      loadBalancer:
        servers: [{ url: "http://payments:4000" }]
        healthCheck: { path: /healthz, interval: 10s, timeout: 3s }
    imgproxy:
      loadBalancer:
        servers: [{ url: "http://imgproxy:8080" }]
    keycloak:
      loadBalancer:
        servers: [{ url: "http://keycloak:8080" }]
    grafana:
      loadBalancer:
        servers: [{ url: "http://grafana:3000" }]
