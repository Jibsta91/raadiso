# Development-only tools. Not mounted by compose.prod.yaml.
{{ $d := env "RAADI_DOMAIN" }}
http:
  routers:
    {{- if ne (env "DEV_TOOLS_ROUTED") "false" }}
    # Off in phone mode (./raadi phone): no dashboards, mail or secrets on the Wi-Fi.
    traefik-dashboard:
      rule: Host(`traefik.{{ $d }}`)
      entryPoints: [web, websecure]
      service: api@internal
      middlewares: [security-headers]
    mailpit:
      rule: Host(`mail.{{ $d }}`)
      entryPoints: [web, websecure]
      service: mailpit
    openbao:
      rule: Host(`bao.{{ $d }}`)
      entryPoints: [web, websecure]
      service: openbao
      middlewares: [security-headers]
    # GlitchTip's UI (ADR-0038); its event intake is routed on the site's own address (routes.yml).
    glitchtip:
      rule: Host(`errors.{{ $d }}`)
      entryPoints: [web, websecure]
      service: glitchtip
      middlewares: [security-headers]
    prometheus:
      rule: Host(`prometheus.{{ $d }}`)
      entryPoints: [web, websecure]
      service: prometheus
      middlewares: [security-headers]
    {{- end }}
    {{- if eq (env "METRO_ROUTED") "true" }}
    # Metro over HTTPS, tunnel mode only (ADR-0034): iOS lets a development build load plain http only from
    # IP addresses. Reached through the Pangolin VPN; it is not a public resource.
    metro:
      rule: Host(`metro.{{ $d }}`)
      entryPoints: [websecure]
      service: metro
    {{- end }}
    # The mock payment provider's hosted page (payments-mock, ADR-0020). Only
    # /pay/ is public; its API is reachable on the internal network only.
    payments-mock:
      rule: Host(`pay.{{ $d }}`) && PathPrefix(`/pay/`)
      entryPoints: [web, websecure]
      service: payments-mock
      middlewares: [security-headers, ratelimit-default]
    # What the push mock received (ADR-0025): read-only, GET /messages only.
    push-mock:
      rule: Host(`push.{{ $d }}`) && Method(`GET`) && Path(`/messages`)
      entryPoints: [web, websecure]
      service: push-mock
      middlewares: [security-headers, ratelimit-default]
  services:
    metro:
      loadBalancer:
        servers: [{ url: "http://expo:8081" }]
    mailpit:
      loadBalancer:
        servers: [{ url: "http://mailpit:8025" }]
    openbao:
      loadBalancer:
        servers: [{ url: "http://openbao:8200" }]
    payments-mock:
      loadBalancer:
        servers: [{ url: "http://payments-mock:4000" }]
    push-mock:
      loadBalancer:
        servers: [{ url: "http://push-mock:4000" }]
    prometheus:
      loadBalancer:
        servers: [{ url: "http://prometheus:9090" }]
