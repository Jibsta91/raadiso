# Static configuration of Pangolin's Traefik (ADR-0034): the public edge in tunnel mode. It shares the
# gerbil container's network namespace, so the ports published on gerbil are its ports. Routes come from
# Pangolin (HTTP provider) and from dynamic/ (the dashboard and the certificates).
global:
  checkNewVersion: false
  sendAnonymousUsage: false

providers:
  http:
    endpoint: 'http://pangolin:3001/api/v1/traefik-config'
    pollInterval: 5s
  file:
    directory: /etc/traefik/dynamic
    watch: true

experimental:
  plugins:
    # Pangolin's authentication middleware (MIT), fetched from the Traefik plugin catalogue at start.
    badger:
      moduleName: github.com/fosrl/badger
      # renovate: datasource=github-tags depName=fosrl/badger
      version: v1.7.0
    # CrowdSec's bouncer (Apache-2.0, ADR-0035): the AppSec (WAF) check at the edge.
    crowdsec:
      moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
      # renovate: datasource=github-tags depName=maxlerebourg/crowdsec-bouncer-traefik-plugin
      version: v1.7.1

entryPoints:
  web:
    address: ':80'
    http:
      middlewares: [crowdsec@file]
  websecure:
    address: ':443'
    transport:
      respondingTimeouts:
        # Long-lived WebSockets (messaging) and slow uploads.
        readTimeout: 30m
    # TLS from the file certificates only (dynamic/pangolin.yml); no ACME resolver. Every request,
    # Pangolin's routes included, passes CrowdSec's WAF first.
    http:
      tls: {}
      middlewares: [crowdsec@file]
      encodedCharacters:
        allowEncodedSlash: true
        allowEncodedQuestionMark: true
  # Health checks only; not published.
  ping:
    address: ':8082'

ping:
  entryPoint: ping

# Targets are newt's tunnel addresses; the TLS name check happens at our own gateway behind it.
serversTransport:
  insecureSkipVerify: true

log:
  level: INFO
  format: json

accessLog:
  format: json
  fields:
    headers:
      defaultMode: drop
