# Observability: OpenTelemetry Collector -> Prometheus (metrics), Loki (logs),
# Tempo (traces); Grafana with provisioned datasources, dashboards and alerts.
x-logging: &logging
  driver: json-file
  options: { max-size: '10m', max-file: '3' }

x-hardening: &hardening
  restart: unless-stopped
  logging: *logging
  security_opt: ['no-new-privileges:true']
  cap_drop: [ALL]

services:
  otel-collector:
    <<: *hardening
    image: ${RAADI_IMAGE_PREFIX}/otel-collector:${RAADI_VERSION}
    pull_policy: build
    build:
      context: deploy/observability/otel-collector
    command: ['--config=/etc/otelcol/config.yaml']
    environment:
      RAADI_ENV: ${RAADI_ENV}
      GOMEMLIMIT: 300MiB
    volumes:
      - ./deploy/observability/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
      - type: volume
        source: secrets
        target: /run/secrets/raadi
        read_only: true
        volume: { subpath: otel-collector }
    depends_on:
      secrets-init: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          'CMD',
          '/usr/local/bin/busybox',
          'wget',
          '-q',
          '-O',
          '/dev/null',
          'http://127.0.0.1:13133/',
        ]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: { memory: 384M, cpus: '1.0' }

  prometheus:
    <<: *hardening
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    environment:
      GOMEMLIMIT: 400MiB
      RAADI_DOMAIN: ${RAADI_DOMAIN}
    # The journey targets carry the public host names (ADR-0031): rendered from the template here.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        sed "s/__DOMAIN__/$${RAADI_DOMAIN}/g" /etc/prometheus/journeys.tmpl.yml > /prometheus/journeys.yml
        && exec /bin/prometheus "$$@"
      - prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION}
      - --storage.tsdb.retention.size=2GB
      - --web.enable-otlp-receiver
      - --web.enable-remote-write-receiver
      - --web.external-url=${PUBLIC_SCHEME}://prometheus.${RAADI_DOMAIN}${PUBLIC_PORT_SUFFIX}
      - --web.route-prefix=/
    volumes:
      - ./deploy/observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:9090/-/ready']
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: { memory: 512M, cpus: '1.0' }

  # Synthetic probes of the main journeys through the gateway (ADR-0031).
  blackbox:
    <<: *hardening
    image: prom/blackbox-exporter:v0.28.0@sha256:e753ff9f3fc458d02cca5eddab5a77e1c175eee484a8925ac7d524f04366c2fc
    # The image runs as root by default; its probes are plain HTTP, which needs no privileges.
    user: '65534:65534'
    command: ['--config.file=/etc/blackbox/blackbox.yml']
    volumes:
      - ./deploy/observability/blackbox:/etc/blackbox:ro
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:9115/-/healthy']
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: { memory: 48M, cpus: '0.25' }

  alertmanager:
    <<: *hardening
    image: prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./deploy/observability/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:9093/-/ready']
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: { memory: 64M, cpus: '0.25' }

  loki:
    <<: *hardening
    image: ${RAADI_IMAGE_PREFIX}/loki:${RAADI_VERSION}
    pull_policy: build
    build:
      context: deploy/observability/loki
    command: ['-config.file=/etc/loki/loki.yaml']
    environment:
      GOMEMLIMIT: 300MiB
    volumes:
      - ./deploy/observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    healthcheck:
      test:
        [
          'CMD',
          '/usr/local/bin/busybox',
          'wget',
          '-q',
          '-O',
          '/dev/null',
          'http://127.0.0.1:3100/ready',
        ]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 30s
    deploy:
      resources:
        limits: { memory: 384M, cpus: '1.0' }

  tempo:
    <<: *hardening
    image: ${RAADI_IMAGE_PREFIX}/tempo:${RAADI_VERSION}
    pull_policy: build
    build:
      context: deploy/observability/tempo
    command: ['-config.file=/etc/tempo/tempo.yaml']
    environment:
      GOMEMLIMIT: 420MiB
    volumes:
      - ./deploy/observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    healthcheck:
      test:
        [
          'CMD',
          '/usr/local/bin/busybox',
          'wget',
          '-q',
          '-O',
          '/dev/null',
          'http://127.0.0.1:3200/ready',
        ]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 30s
    deploy:
      resources:
        limits: { memory: 512M, cpus: '1.0' }

  grafana:
    <<: *hardening
    image: grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
    environment:
      GOMEMLIMIT: 400MiB
      GF_SERVER_ROOT_URL: ${GRAFANA_BASE_URL}
      GF_SERVER_ENABLE_GZIP: 'true'
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/raadi/grafana_admin_password
      GF_SECURITY_DISABLE_GRAVATAR: 'true'
      GF_SECURITY_COOKIE_SAMESITE: lax
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
      GF_NEWS_NEWS_FEED_ENABLED: 'false'
      GF_LOG_MODE: console
      GF_LOG_CONSOLE_FORMAT: json
      GF_TRACING_OPENTELEMETRY_OTLP_ADDRESS: otel-collector:4317
      GF_TRACING_OPENTELEMETRY_CUSTOM_ATTRIBUTES: service.namespace:raadi,deployment.environment.name:${RAADI_ENV}
      GF_SMTP_ENABLED: 'true'
      GF_SMTP_HOST: mailpit:1025
      GF_SMTP_FROM_ADDRESS: grafana@${RAADI_DOMAIN}
      # Single sign-on through Keycloak. Only platform admins (Admin) and
      # moderators (Viewer) may sign in; everyone else is rejected.
      GF_AUTH_GENERIC_OAUTH_ENABLED: 'true'
      GF_AUTH_GENERIC_OAUTH_NAME: Raadi SSO
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: grafana
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET__FILE: /run/secrets/raadi/grafana_oidc_client_secret
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid email profile
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: 'true'
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: ${AUTH_BASE_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/auth
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: http://keycloak:8080/realms/${KEYCLOAK_REALM}/protocol/openid-connect/token
      GF_AUTH_GENERIC_OAUTH_API_URL: http://keycloak:8080/realms/${KEYCLOAK_REALM}/protocol/openid-connect/userinfo
      GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH: email
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: preferred_username
      GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH: name
      # Operators run the platform day to day: they may edit dashboards and silence alerts (Editor).
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(roles[*], 'platform-admin') && 'Admin' || contains(roles[*], 'operator') && 'Editor' || contains(roles[*], 'moderator') && 'Viewer'"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: 'true'
      GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: 'true'
      GF_AUTH_SIGNOUT_REDIRECT_URL: ${AUTH_BASE_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/logout?client_id=grafana&post_logout_redirect_uri=${GRAFANA_BASE_URL}/login
      TZ: ${TZ}
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
      - type: volume
        source: secrets
        target: /run/secrets/raadi
        read_only: true
        volume: { subpath: grafana }
    depends_on:
      secrets-init: { condition: service_completed_successfully }
      prometheus: { condition: service_started }
      loki: { condition: service_started }
      tempo: { condition: service_started }
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3000/api/health']
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 30s
    deploy:
      resources:
        limits: { memory: 512M, cpus: '1.0' }

  # GlitchTip (MIT, ADR-0038): crash and error reports from the website and the app (Sentry SDKs). One
  # container (web and worker together) on its own PostgreSQL database, no Valkey. Reports arrive on the
  # site's own address (/errors/…, deploy/traefik/dynamic/common/routes.yml); the UI is errors.<domain>.
  glitchtip:
    <<: *hardening
    image: glitchtip/glitchtip:6.2.6@sha256:a3d8eb1b36c1e1603d55ab32711ea3dd8115874742a781a57391a62a16e0dff6
    entrypoint: ['bash', '-c']
    command:
      - >-
        export DATABASE_URL="postgres://glitchtip:$$(cat /run/secrets/raadi/glitchtip_db_password)@postgres:5432/glitchtip"
        SECRET_KEY="$$(cat /run/secrets/raadi/glitchtip_secret_key)" &&
        exec ./bin/start.sh
    environment:
      SERVER_ROLE: all_in_one
      GRANIAN_WORKERS: '1'
      GRANIAN_WORKERS_MAX_RSS: '320'
      # Empty: PostgreSQL holds the task queue, cache and sessions.
      VALKEY_URL: ''
      GLITCHTIP_DOMAIN: ${PUBLIC_SCHEME}://errors.${RAADI_DOMAIN}${PUBLIC_PORT_SUFFIX}
      ALLOWED_HOSTS: errors.${RAADI_DOMAIN},${RAADI_DOMAIN},glitchtip,localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: ${PUBLIC_SCHEME}://errors.${RAADI_DOMAIN}${PUBLIC_PORT_SUFFIX}
      DEFAULT_FROM_EMAIL: glitchtip@${RAADI_DOMAIN}
      EMAIL_URL: smtp://${SMTP_HOST}:${SMTP_PORT}
      ENABLE_USER_REGISTRATION: 'false'
      ENABLE_ORGANIZATION_CREATION: 'false'
      # Error reports are client data: kept 30 days (GlitchTip's default is 90).
      GLITCHTIP_RETENTION_DAYS: '30'
      TZ: ${TZ}
    volumes:
      - type: volume
        source: secrets
        target: /run/secrets/raadi
        read_only: true
        volume: { subpath: glitchtip }
    depends_on:
      secrets-init: { condition: service_completed_successfully }
      db-init: { condition: service_completed_successfully }
    healthcheck:
      test: ['CMD', 'python', 'healthcheck.py']
      interval: 10s
      timeout: 6s
      retries: 30
      start_period: 60s
    deploy:
      resources:
        limits: { memory: 512M, cpus: '1.0' }

  # The admin, the organisation and the project with the key from .env (deploy/glitchtip/bootstrap.py).
  glitchtip-init:
    image: glitchtip/glitchtip:6.2.6@sha256:a3d8eb1b36c1e1603d55ab32711ea3dd8115874742a781a57391a62a16e0dff6
    entrypoint: ['bash', '-c']
    command:
      - >-
        export DATABASE_URL="postgres://glitchtip:$$(cat /run/secrets/raadi/glitchtip_db_password)@postgres:5432/glitchtip"
        SECRET_KEY="$$(cat /run/secrets/raadi/glitchtip_secret_key)" &&
        python manage.py shell < /opt/raadi/bootstrap.py
    restart: 'no'
    logging: *logging
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    environment:
      VALKEY_URL: ''
      ALLOWED_HOSTS: localhost
      GLITCHTIP_DOMAIN: ${PUBLIC_SCHEME}://errors.${RAADI_DOMAIN}${PUBLIC_PORT_SUFFIX}
      GLITCHTIP_ADMIN_EMAIL: ${GLITCHTIP_ADMIN_EMAIL}
      GLITCHTIP_PUBLIC_KEY: ${GLITCHTIP_PUBLIC_KEY}
      GLITCHTIP_PROJECT_ID: ${GLITCHTIP_PROJECT_ID}
    volumes:
      - ./deploy/glitchtip/bootstrap.py:/opt/raadi/bootstrap.py:ro
      - type: volume
        source: secrets
        target: /run/secrets/raadi
        read_only: true
        volume: { subpath: glitchtip }
    depends_on:
      glitchtip: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 256M, cpus: '0.5' }

volumes:
  prometheus-data: {}
  alertmanager-data: {}
  loki-data: {}
  tempo-data: {}
  grafana-data: {}
  secrets: {}
