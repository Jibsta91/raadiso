# Developer & operator tooling (profile "tools"; never started by plain `up`).
#   docker compose run --rm toolbox <command>
# The repository is bind-mounted; node_modules live in named volumes so nothing
# platform-specific is ever written to the host.
x-workspace: &workspace
  image: ${RAADI_IMAGE_PREFIX}/toolbox:${RAADI_VERSION}
  pull_policy: build
  build:
    context: .
    dockerfile: deploy/toolbox/Dockerfile
  volumes:
    - .:/workspace
    - nm-root:/workspace/node_modules
    - nm-web:/workspace/apps/web/node_modules
    - nm-mobile:/workspace/apps/mobile/node_modules
    - nm-identity-bff:/workspace/services/identity-bff/node_modules
    - nm-listings:/workspace/services/listings/node_modules
    - nm-media:/workspace/services/media/node_modules
    - nm-search:/workspace/services/search/node_modules
    - nm-messaging:/workspace/services/messaging/node_modules
    - nm-notifications:/workspace/services/notifications/node_modules
    - nm-trust:/workspace/services/trust/node_modules
    - nm-payments:/workspace/services/payments/node_modules
    - nm-payments-mock:/workspace/services/payments-mock/node_modules
    - nm-push-mock:/workspace/services/push-mock/node_modules
    - nm-saved:/workspace/services/saved/node_modules
    - nm-audit:/workspace/services/audit/node_modules
    - nm-service-kit:/workspace/packages/service-kit/node_modules
    - nm-ui:/workspace/packages/ui/node_modules
    - nm-api-client:/workspace/packages/api-client/node_modules
    - nm-catalog:/workspace/packages/catalog/node_modules
    - nm-events:/workspace/packages/events/node_modules
    - nm-config:/workspace/packages/config/node_modules
    - nm-e2e:/workspace/tests/e2e/node_modules
    - pnpm-store:/pnpm/store
    - /var/run/docker.sock:/var/run/docker.sock
  environment:
    RAADI_DOMAIN: ${RAADI_DOMAIN}
    PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
    ADMIN_BASE_URL: ${ADMIN_BASE_URL}
    AUTH_BASE_URL: ${AUTH_BASE_URL}
    GRAFANA_BASE_URL: ${GRAFANA_BASE_URL}
    DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD}
    TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /var/run/docker.sock
    TESTCONTAINERS_RYUK_DISABLED: 'false'
  deploy:
    resources:
      limits: { memory: 4G }

services:
  toolbox:
    <<: *workspace
    profiles: [tools]
    extra_hosts: ['host.docker.internal:host-gateway']

  # Playwright runs inside Traefik's network namespace, so Chromium resolves
  # *.raadi.localhost to 127.0.0.1 and reaches the gateway exactly like a
  # browser on your laptop does.
  e2e:
    <<: *workspace
    profiles: [tools, test]
    network_mode: service:traefik
    # Chromium keeps renderer memory in /dev/shm; Docker's 64 MB default
    # crashes it on large single-page apps such as Grafana.
    shm_size: 512m
    command: ['e2e']
    depends_on:
      summary: { condition: service_healthy }

volumes:
  nm-root: {}
  nm-web: {}
  nm-mobile: {}
  nm-identity-bff: {}
  nm-listings: {}
  nm-media: {}
  nm-search: {}
  nm-messaging: {}
  nm-notifications: {}
  nm-trust: {}
  nm-payments: {}
  nm-payments-mock: {}
  nm-push-mock: {}
  nm-saved: {}
  nm-audit: {}
  nm-service-kit: {}
  nm-ui: {}
  nm-api-client: {}
  nm-catalog: {}
  nm-events: {}
  nm-config: {}
  nm-e2e: {}
  pnpm-store: {}
