# Arcane, the owner's Docker UI (ADR-0058): not part of the stack, started on its own on the server,
# as the prod user in DEPLOY_DIR:
#   docker compose -p arcane --env-file .env -f deploy/arcane/compose.yaml up -d
# It holds the Docker socket, so whoever gets into it controls every container: it publishes no port
# and is reached only through the staff gate on arcane.$RAADI_DOMAIN (set ARCANE_URL, docs/deploy.md).
# Its encryption key lives in deploy/arcane/arcane.env on the server (Git ignores it, chmod 600).
name: arcane

services:
  arcane:
    image: ghcr.io/getarcaneapp/manager:v2.15.1@sha256:540c01198ca3e58dfd398d25c57c8dc241fa7e7f3d1d8d646c8268f19525b1a8
    container_name: arcane
    restart: unless-stopped
    # ENCRYPTION_KEY and JWT_SECRET (sessions survive restarts); docs/deploy.md.
    env_file: [arcane.env]
    environment:
      TZ: UTC
      # Started with -p arcane --env-file .env (docs/deploy.md), so the stack's domain is known here.
      APP_URL: https://arcane.${RAADI_DOMAIN:?start with --env-file .env}
      # Only Traefik on raadi_default reaches it, so X-Forwarded-For from Docker's ranges is trusted.
      TRUSTED_PROXIES: 172.16.0.0/12
      # No heartbeat to getarcane.app.
      ANALYTICS_DISABLED: 'true'
      LOG_JSON: 'true'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - arcane-data:/app/data
    security_opt: ['no-new-privileges:true']
    # Lets Arcane recognise its own container (upstream's example).
    cgroup: host
    deploy:
      resources:
        limits: { memory: 256M }
    healthcheck:
      test: ['CMD', './arcane', 'health', '--timeout', '2s']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks: [raadi]

networks:
  # The stack's network, so Traefik reaches Arcane as http://arcane:3552.
  raadi:
    name: raadi_default
    external: true

volumes:
  arcane-data:
