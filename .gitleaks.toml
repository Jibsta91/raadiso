# Gitleaks configuration: default rules plus narrowly scoped allowlists.
title = "raadi"

[extend]
useDefault = true

[[allowlists]]
description = "Build output and dependencies (never committed)"
paths = [
  '''(^|/)node_modules/''',
  '''(^|/)\.next/''',
  '''(^|/)\.build/''',
  '''(^|/)dist/''',
  '''(^|/)\.turbo/''',
  '''(^|/)playwright-report/''',
]

[[allowlists]]
description = "Public list of common passwords, used to refuse them (deploy/keycloak/password-blacklists)"
paths = ['''^deploy/keycloak/password-blacklists/common-12plus\.txt$''']

[[allowlists]]
description = "Known false positives of generic-api-key"
regexTarget = "line"
regexes = [
  # image references such as valkey/valkey:9.1.2-alpine3.24
  '''valkey/valkey:[\w.-]+''',
  # C4 diagram element named "sec"
  '''Container\(sec, "ai-cybersecurity"''',
  # imgproxy's published example signing key (packages/service-kit/test/imgproxy.test.ts)
  '''943b421c9eb07c830af81030552c86009268de4e532ba2ee2eab8247c6da0881''',
  # RFC 6455 sample WebSocket handshake nonce ("the sample nonce"), used by the smoke test
  '''Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==''',
  # Pangolin's fixed CSRF header value, the same for everyone (deploy/init/scripts/pangolin-init.sh)
  '''X-CSRF-Token: x-csrf-protection''',
]
